<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <title id="t">How big a 35 cm drone looks with distance</title>
  <desc id="d">A 35 cm multirotor subtends about 6 minutes of arc at 200 m, 3 at 400 m and 2 at 600 m. At 200 m you can tell which way it points; at 400 m it is a dot; at 600 m against trees or grey sky you may lose it.</desc>
  <rect width="860" height="300" fill="#141920"/>
  <g font-size="13" fill="#a7b1bf" text-anchor="middle">
    <g transform="translate(150 120)">
      <rect x="-90" y="-70" width="180" height="140" rx="10" fill="#1b222b"/>
      <g stroke="#e6eaf0" stroke-width="3"><line x1="-18" y1="-18" x2="18" y2="18"/><line x1="-18" y1="18" x2="18" y2="-18"/></g>
      <g fill="#e6eaf0"><circle cx="-18" cy="-18" r="7"/><circle cx="18" cy="-18" r="7"/><circle cx="-18" cy="18" r="7"/><circle cx="18" cy="18" r="7"/></g>
      <circle cx="0" cy="-4" r="3" fill="#f0524a"/>
    </g>
    <g transform="translate(430 120)">
      <rect x="-90" y="-70" width="180" height="140" rx="10" fill="#1b222b"/>
      <g stroke="#e6eaf0" stroke-width="2"><line x1="-9" y1="-9" x2="9" y2="9"/><line x1="-9" y1="9" x2="9" y2="-9"/></g><g fill="#e6eaf0"><circle cx="-9" cy="-9" r="3.5"/><circle cx="9" cy="-9" r="3.5"/><circle cx="-9" cy="9" r="3.5"/><circle cx="9" cy="9" r="3.5"/></g>
    </g>
    <g transform="translate(710 120)">
      <rect x="-90" y="-70" width="180" height="140" rx="10" fill="#2a3226"/>
      <g fill="#4c5544"><circle cx="-6" cy="-6" r="2.5"/><circle cx="6" cy="-6" r="2.5"/><circle cx="-6" cy="6" r="2.5"/><circle cx="6" cy="6" r="2.5"/><rect x="-4" y="-2" width="8" height="4"/></g>
    </g>
    <text x="150" y="220" fill="#e6eaf0" font-weight="600">200 m: about 6 arc minutes</text>
    <text x="150" y="238">clear, nose direction visible</text>
    <text x="430" y="220" fill="#e6eaf0" font-weight="600">400 m: about 3</text>
    <text x="430" y="238">a dot: orientation is a guess</text>
    <text x="710" y="220" fill="#e6eaf0" font-weight="600">600 m: about 2</text>
    <text x="710" y="238">against trees: easily lost</text>
  </g>
  <text x="430" y="280" fill="#6e7988" font-size="11" text-anchor="middle">Size drawn relative to the 200 m view. Angle in arc minutes = 3438 x size / distance (0.35 m / 200 m is 6.0).</text>
</svg>
